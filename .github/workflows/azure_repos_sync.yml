name: Sync to Azure Repos

on:
  push:
    branches:
      - dev

env:
    AZURE_DEVOPS_USERNAME: ${{ secrets.AZURE_DEVOPS_USERNAME }}
    AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v3

      - name: Sync to Azure DevOps Repos
        run: |
          git remote set-url azure https://${{ env.AZURE_DEVOPS_USERNAME }}:${{ env.AZURE_DEVOPS_PAT }}@dev.azure.com/0xsr1r4m/sky.xyz/_git/filmagix.git
          git push --force --mirror azure