apiVersion: v1
kind: Service
metadata:
  name: filmagix
  namespace: app
  labels:
    app: filmagix
spec:
  type: LoadBalancer
  selector:
    app: filmagix
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8000
      protocol: TCP
